# =============================================================================
# CreditWise Secrets
# =============================================================================
# Sensitive configuration - base64 encoded
# NOTE: In production, use External Secrets Operator or Sealed Secrets
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: creditwise-secrets
  namespace: creditwise
  labels:
    app.kubernetes.io/name: creditwise
    app.kubernetes.io/component: secrets
type: Opaque
data:
  # Base64 encoded values (decode with: echo -n 'value' | base64)
  # These are example values - CHANGE IN PRODUCTION!
  
  # PostgreSQL password: creditwise_password
  POSTGRES_PASSWORD: Y3JlZGl0d2lzZV9wYXNzd29yZA==
  
  # PostgreSQL user: creditwise
  POSTGRES_USER: Y3JlZGl0d2lzZQ==
  
  # JWT Secret (base64 of base64 secret)
  JWT_SECRET: WTNKbFpHbDBkMmx6WlMxemRYQmxjaTF6WldOeVpYUXRhMlY1TFdadmNpMXFkM1F0ZEc5clpXNHRaMlZ1WlhKaGRHbHZiaTFqYUdGdVoyVXRhVzR0Y0hKdlpIVmpkR2x2Ymc9PQ==
  
  # FastAPI Secret Key: creditwise-super-secret-key
  SECRET_KEY: Y3JlZGl0d2lzZS1zdXBlci1zZWNyZXQta2V5

---
# Database URL Secret (constructed from other secrets)
apiVersion: v1
kind: Secret
metadata:
  name: database-url
  namespace: creditwise
type: Opaque
stringData:
  # Spring Boot format
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/creditwise"
  
  # SQLAlchemy format (FastAPI)
  DATABASE_URL: "postgresql://creditwise:creditwise_password@postgres:5432/creditwise"

