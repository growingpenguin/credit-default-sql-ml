# =============================================================================
# Spring Boot Backend
# =============================================================================
# Java REST API for CreditWise platform
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-backend
  namespace: creditwise
  labels:
    app.kubernetes.io/name: spring-backend
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spring-backend
  template:
    metadata:
      labels:
        app: spring-backend
        app.kubernetes.io/name: spring-backend
    spec:
      containers:
        - name: spring-backend
          image: creditwise/spring-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: creditwise-config
            - secretRef:
                name: creditwise-secrets
            - secretRef:
                name: database-url
          env:
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: creditwise-secrets
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: creditwise-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3

---
apiVersion: v1
kind: Service
metadata:
  name: spring-backend
  namespace: creditwise
  labels:
    app.kubernetes.io/name: spring-backend
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: spring-backend

