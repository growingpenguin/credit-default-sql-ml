# =============================================================================
# CreditWise Nginx Configuration (Local Development)
# =============================================================================
# Reverse proxy configuration for local development with Homebrew Nginx
#
# Installation:
#   brew install nginx
#   cp nginx/nginx.conf /opt/homebrew/etc/nginx/nginx.conf
#   brew services restart nginx
#
# Access at: http://localhost
# =============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /opt/homebrew/etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    access_log /opt/homebrew/var/log/nginx/access.log;
    error_log  /opt/homebrew/var/log/nginx/error.log;

    # Performance
    sendfile on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ==========================================================================
    # Upstream Services (Local Development)
    # ==========================================================================
    
    upstream frontend {
        server 127.0.0.1:3001;  # React Vite dev server
    }

    upstream spring-backend {
        server 127.0.0.1:8080;  # Spring Boot
    }

    upstream fastapi-ml {
        server 127.0.0.1:8000;  # FastAPI
    }

    # ==========================================================================
    # Main Server
    # ==========================================================================
    
    server {
        listen 80;
        server_name localhost;

        # Health check
        location /health {
            return 200 '{"status":"healthy","service":"nginx-proxy"}';
            add_header Content-Type application/json;
        }

        # -----------------------------------------------------------------
        # Spring Boot API (/api/)
        # -----------------------------------------------------------------
        location /api/ {
            proxy_pass http://spring-backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
        }

        # -----------------------------------------------------------------
        # FastAPI ML Service (/ml/)
        # -----------------------------------------------------------------
        location /ml/ {
            proxy_pass http://fastapi-ml/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;  # ML predictions may be slow
        }

        # -----------------------------------------------------------------
        # React Frontend (default - with hot reload support)
        # -----------------------------------------------------------------
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # WebSocket support for Vite HMR
        location /ws {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
