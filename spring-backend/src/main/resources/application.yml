# =============================================================================
# CreditWise Spring Boot Configuration
# =============================================================================

spring:
  application:
    name: creditwise-api
  
  # PostgreSQL Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/creditwise
    username: ${DB_USERNAME:growingpenguin}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  
  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update  # auto-create/update tables
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  # Jackson JSON Configuration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /api

# JWT Configuration
# Base64 encoded secret (at least 256 bits for HS256)
jwt:
  secret: ${JWT_SECRET:Y3JlZGl0d2lzZS1zdXBlci1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tZ2VuZXJhdGlvbi1jaGFuZ2UtaW4tcHJvZHVjdGlvbg==}
  expiration: 86400000  # 24 hours in milliseconds

# CORS Configuration
cors:
  allowed-origins: http://localhost:3000,http://localhost:3001,http://localhost:5173

# Logging
logging:
  level:
    com.creditwise: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

# OpenAPI / Swagger Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

